<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Markdown Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="katex.css">
</head>

<body>
  <div id="toolbar">
    <button id="backBtn" disabled>←</button>
    <button id="forwardBtn" disabled>→</button>
    <div class="toolbar-separator"></div>
    <button id="openBtn">Open File</button>
    <button id="openFolderBtn">Open Folder</button>
    <select id="recentFiles">
      <option value="">Recent Files</option>
    </select>
    <button id="editBtn" style="display:none;">Edit</button>
    <button id="compareBtn" style="display:none;">Compare</button>
    <button id="exportBtn" style="display:none;">Export PDF</button>
    <button id="searchBtn">🔍 Search</button>
    <button id="tocBtn">📑 TOC</button>
    <button id="layoutWidthBtn" title="Change reading width">Width</button>
    <button id="zoomModeBtn" title="Toggle fixed-layout zoom">Vector</button>
    <button id="zoomResetBtn" title="Reset zoom">100%</button>
    <button id="darkModeBtn">🌙</button>
    <span id="filename"></span>
  </div>

  <div id="tabsBar" style="display:none;"></div>
  <div id="appNotification" class="hidden" role="status" aria-live="polite"></div>

  <!-- Search Panel -->
  <div id="searchPanel" style="display:none;">
    <input type="text" id="searchInput" placeholder="Search in document...">
    <button id="searchPrev">↑</button>
    <button id="searchNext">↓</button>
    <span id="searchCount">0/0</span>
    <button id="searchClose">✕</button>
  </div>

  <div id="main-container">
    <aside id="workspaceSidebar" class="hidden">
      <div id="workspaceHeader">
        <div>
          <span class="sidebar-label">EXPLORER</span>
          <strong id="workspaceName">No Folder Open</strong>
        </div>
        <button id="workspaceCloseBtn" title="Close folder">✕</button>
      </div>
      <div id="workspaceTree" role="tree"></div>
    </aside>

    <!-- Table of Contents Sidebar -->
    <div id="tocSidebar" class="hidden">
      <div id="tocHeader">
        <h3>Table of Contents</h3>
        <button id="tocCloseBtn">✕</button>
      </div>
      <div id="tocContent"></div>
    </div>

    <div id="container">
      <div id="zoomSurface">
        <div id="viewer" class="active"></div>
      </div>
      <div id="editorSurface" style="display:none;">
        <pre id="editorHighlight" aria-hidden="true"><code></code></pre>
        <textarea id="editor" spellcheck="false" aria-label="File editor"></textarea>
      </div>
      <div id="compareSurface" style="display:none;">
        <div id="compareViewer"></div>
      </div>
    </div>
  </div>

  <div id="diagramLightbox" class="hidden">
    <div id="diagramToolbar">
      <button id="diagramZoomOut">-</button>
      <button id="diagramZoomReset">100%</button>
      <button id="diagramZoomIn">+</button>
      <button id="diagramClose">×</button>
    </div>
    <div id="diagramStage">
      <div id="diagramContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
